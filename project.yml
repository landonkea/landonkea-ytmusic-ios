# ── project.yml — xcodegen spec for YTMusicApp (iOS) ────────────
# This file is the SOURCE of truth for the Xcode project.
# To generate (or regenerate) the .xcodeproj:
#     xcodegen generate
# NOTE: The .xcodeproj is gitignored — always generate it locally
# with the command above after cloning or changing this file.

# "name:" is the Xcode project name.
name: YTMusicApp

# "options:" controls how the project is generated.
options:
  # Minimum iOS version this app supports.
  deploymentTarget:
    iOS: "17.0"
  # Create folders that contain no files so the navigator stays tidy.
  generateEmptyDirectories: true

# "configFiles:" applies an xcconfig at the PROJECT level for each build
# configuration, before any target-level settings. We use this to inject
# secrets (API keys, etc.) as build settings instead of hardcoding them in
# source. Config/Secrets.xcconfig is gitignored — copy
# Config/Secrets.example.xcconfig to Config/Secrets.xcconfig and fill in
# real values before building. See that file for what each setting means.
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig

# "targets:" defines what gets built.
targets:
  # ── YTMusicApp — the application target ──────────────────────
  # NOTE: The API layer (YTMusicAPI) is compiled INTO this target
  # instead of a separate framework.  The code was written as one
  # module (no `public` access modifiers), so keeping a single
  # module avoids a large, error-prone `public` refactor.
  YTMusicApp:
    type: application
    platform: iOS
    # All app source files (views, services, utilities) AND the
    # API layer sources (client, models) — one module total. Also includes
    # Sources/YTMusicShared, the small App-Group-sync types shared with the
    # YTMusicWidgetExtension target below (see NowPlayingSnapshot.swift).
    sources:
      - path: Sources/YTMusicApp
      - path: Sources/YTMusicAPI
      - path: Sources/YTMusicShared
    # Apple SDK frameworks the app uses (imported in its source files):
    dependencies:
      # AVFoundation — audio playback (AVPlayer in AudioPlayer).
      - sdk: AVFoundation.framework
      # MediaPlayer — lock screen / Control Center integration
      # (MPRemoteCommandCenter in AudioPlayer).
      - sdk: MediaPlayer.framework
      # BackgroundTasks — BGTaskScheduler for background refresh.
      - sdk: BackgroundTasks.framework
      # Intents — Siri shortcuts (INInteraction, INPlayMediaIntent).
      - sdk: Intents.framework
      # Speech — voice search (SFSpeechRecognizer in VoiceSearchManager).
      - sdk: Speech.framework
      # UIKit — used alongside SwiftUI for some components.
      - sdk: UIKit.framework
      # Network — NWPathMonitor, used by OfflineManager to detect Wi-Fi
      # vs. cellular so the "Wi-Fi Only" downloads setting is actually
      # enforced instead of just cosmetic.
      - sdk: Network.framework
      # WidgetKit — WidgetCenter.reloadTimelines(ofKind:), called by
      # AudioPlayer whenever the song/play state changes so the Home
      # Screen / Lock Screen Now Playing widget redraws.
      - sdk: WidgetKit.framework
      # CloudKit — CKContainer/CKRecord, used by CloudKitSyncManager to
      # sync playlists + liked songs (only) across a user's devices via
      # their private iCloud database. See CloudKitSyncManager.swift.
      - sdk: CloudKit.framework
      # Embed the widget extension into the app bundle so installing the
      # app also installs its widget (the standard way a widget ships —
      # there's no separate download).
      - target: YTMusicWidgetExtension
        embed: true
    settings:
      base:
        # The unique bundle identifier for the app.
        PRODUCT_BUNDLE_IDENTIFIER: com.landonkea.ytmusic
        # Generate a basic Info.plist automatically (Xcode fills in
        # the standard keys like bundle id, version, etc.).
        GENERATE_INFOPLIST_FILE: YES
        # Merge fragment for custom (non-"well-known") Info.plist keys —
        # see Sources/YTMusicApp/Resources/Info.plist for why this is
        # needed: INFOPLIST_KEY_INNERTUBE_API_KEY alone silently gets
        # dropped by GENERATE_INFOPLIST_FILE because Xcode only
        # auto-injects INFOPLIST_KEY_* settings for keys it recognizes as
        # standard. This makes Xcode MERGE the fragment's custom entries
        # (like INNERTUBE_API_KEY and the "ytmusic://" URL scheme the
        # widget deep-links back into) into the generated plist instead.
        INFOPLIST_FILE: Sources/YTMusicApp/Resources/Info.plist
        # The app uses SwiftUI @main — no storyboard needed.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Portrait + landscape orientations both supported.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # App display name shown under the icon.
        INFOPLIST_KEY_CFBundleDisplayName: "YT Music"
        # Voice search uses on-device speech recognition — iOS requires
        # this usage string or the app crashes at the first request.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Voice search lets you search for songs, artists, and albums by speaking instead of typing."
        # Voice search records audio through the microphone — required usage string.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Voice search needs microphone access to hear your spoken search."
        # Only build for the device architectures Xcode runs on.
        ONLY_ACTIVE_ARCH: YES
        # Signing for the simulator — no team needed for local builds.
        CODE_SIGN_STYLE: Automatic
        # SwiftUI lifecycle with a modern deployment target.
        SWIFT_VERSION: "5.0"
        # Explicit version numbers (rather than leaving them to Xcode's
        # defaults) so they match YTMusicWidget/Info.plist's hardcoded
        # CFBundleShortVersionString/CFBundleVersion — an embedded
        # extension's CFBundleVersion must match its containing app's, or
        # Xcode's embedded-binary validation prints a warning at build time.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Grants access to the group.com.landonkea.ytmusic shared
        # container the Now Playing widget reads from — see
        # YTMusicApp.entitlements for the full explanation, including the
        # no-signing-team local-build caveat.
        CODE_SIGN_ENTITLEMENTS: Sources/YTMusicApp/Resources/YTMusicApp.entitlements
        # ── Mac Catalyst ────────────────────────────────────────────
        # Lets this iOS target also build/run as a native Mac app via
        # Catalyst (UIKit/SwiftUI translated to AppKit under the hood).
        SUPPORTS_MACCATALYST: YES
        # "1,2,6" = iPhone + iPad + Mac (Catalyst). Without 6 in this
        # list, Xcode won't offer/produce a Mac Catalyst build at all.
        TARGETED_DEVICE_FAMILY: "1,2,6"
        # Keep ONE bundle identifier (com.landonkea.ytmusic) across iOS
        # and Mac Catalyst instead of Xcode's default behavior of
        # appending ".maccatalyst" for the Catalyst variant. This matters
        # because YTMusicWidgetExtension's Info.plist and embedding
        # validation require the extension's bundle id to stay prefixed
        # by the CONTAINING app's bundle id (com.landonkea.ytmusic.widget
        # under com.landonkea.ytmusic) — if the app's Catalyst id
        # diverged to com.landonkea.ytmusic.maccatalyst, that prefix
        # relationship (and the shared App Group) would break for the
        # Catalyst build.
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO

  # ── YTMusicWidgetExtension — Home Screen / Lock Screen widget ──
  # A WidgetKit "app extension" target: a small, separate process the
  # system launches to render the Now Playing widget. It never runs
  # AudioPlayer or touches the network beyond fetching the current song's
  # artwork — it just reads the snapshot AudioPlayer wrote to the shared
  # App Group container. See Sources/YTMusicShared/NowPlayingSnapshot.swift
  # for the full data-flow explanation.
  YTMusicWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/YTMusicWidget
      - path: Sources/YTMusicShared
    dependencies:
      # WidgetKit — Widget, WidgetBundle, TimelineProvider, TimelineEntry.
      - sdk: WidgetKit.framework
      # SwiftUI — the widget's views (SmallNowPlayingView, etc.).
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.landonkea.ytmusic.widget
        # This target supplies its own complete Info.plist (with the
        # NSExtensionPointIdentifier that marks it as a WidgetKit
        # extension) instead of a generated one.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/YTMusicWidget/Info.plist
        # Same App Group as YTMusicApp.entitlements — required for both
        # processes to resolve the same shared UserDefaults suite.
        CODE_SIGN_ENTITLEMENTS: Sources/YTMusicWidget/YTMusicWidget.entitlements
        ONLY_ACTIVE_ARCH: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
        # Must also support Mac Catalyst — an embedded extension has to be
        # built for every platform variant its containing app builds for,
        # or Xcode can't embed it into the Catalyst variant of YTMusicApp.
        # WidgetKit widgets appear in Notification Center on Mac when a
        # Catalyst app ships one; no extension code changes are needed.
        SUPPORTS_MACCATALYST: YES
        TARGETED_DEVICE_FAMILY: "1,2,6"
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO

  # ── YTMusicAppTests — unit tests, runs on the simulator ────────
  # Exercises real runtime behavior (not just compilation), e.g. the
  # EqualizerEngine attach()-before-connect() crash fix: a test builds
  # a real AVAudioEngine graph through EqualizerEngine.playFile() and
  # asserts it doesn't throw/crash.
  YTMusicAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/YTMusicAppTests
    dependencies:
      - target: YTMusicApp
    settings:
      base:
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        # So `xcodebuild test` can also target the Mac Catalyst
        # destination (the test bundle has to support every platform
        # variant its host app builds for).
        SUPPORTS_MACCATALYST: YES
        TARGETED_DEVICE_FAMILY: "1,2,6"
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO

# "schemes:" defines the build/run scheme used by Xcode's toolbar.
schemes:
  YTMusicApp:
    build:
      targets:
        YTMusicApp: all
        YTMusicAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YTMusicAppTests
